name: NodeJS with Webpack

on:
  push:
    branches: [ "stage", "production" ]
  # pull_request:
  #   branches: [ development ]
    
  # Allows you to run this workflow manually from the Actions tab 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    environment:
      name: ${{ github.ref_name }}

    strategy:
      matrix:
        node-version: [20.x]
    
    steps:
    - uses: actions/checkout@v2

    - name: Install SSH Key
      uses: shimataro/ssh-key-action@v2
      with:
        key: ${{ secrets.SSH_PRIVATE_KEY_GITHUB_ACTIONS }}
        known_hosts: 'just-a-placeholder-so-we-dont-get-errors'

    - name: Adding Known Hosts
      run: ssh-keyscan -H ${{ vars.DROPLET_IP_ADDRESS }} >> ~/.ssh/known_hosts

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v1
      with:
        node-version: ${{ matrix.node-version }}

    - name: Build
      run: |
        git submodule update --init --recursive
        npm install
        npm run build_${{github.ref_name}}_OnLinux

    - name: Deploy
      run: scp -r public root@${{ vars.DROPLET_IP_ADDRESS }}:/var/www/banquetNinja
    
    # - name: Trigger restart
    #   run: ssh -t root@${{ vars.DROPLET_IP_ADDRESS }} "bash /var/www/banquetNinja/deploy.sh"
